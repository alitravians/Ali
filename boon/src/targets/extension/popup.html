<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>BOON</title>
    <style>
        body {
            margin: 0;
            width: 280px;
            font-family: -apple-system, "Segoe UI", "gg sans", "Noto Sans Arabic", sans-serif;
            background: #2b2d31;
            color: #f2f3f5;
            padding: 16px;
        }
        h1 {
            margin: 0 0 4px;
            font-size: 18px;
            color: #fff;
        }
        h1 small {
            font-size: 11px;
            color: #b5bac1;
            font-weight: normal;
            margin-inline-start: 8px;
        }
        p { color: #b5bac1; font-size: 13px; margin: 0 0 12px; line-height: 1.4; }
        .row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-top: 1px solid #1e1f22;
        }
        .row:first-of-type { border-top: none; }
        a.btn {
            display: block;
            background: #5865F2; color: white;
            padding: 8px 12px; border-radius: 4px;
            text-align: center; text-decoration: none;
            font-size: 13px; font-weight: 600;
            margin-top: 8px;
        }
        a.btn:hover { background: #4752c4; }
        kbd {
            background: #1e1f22;
            border: 1px solid #1e1f22;
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <h1>BOON <small>v0.1.0</small></h1>
    <p>Discord client mod — مفعّل تلقائياً على discord.com.</p>

    <div class="row"><span>الحالة</span><span style="color:#23a55a">●  نشط</span></div>
    <div class="row"><span>الإضافات</span><span>5 / 5</span></div>
    <div class="row"><span>اختصار الإعدادات</span><kbd>Ctrl+Shift+B</kbd></div>

    <a class="btn" href="https://discord.com/app" target="_blank">افتح Discord</a>
</body>
</html>
