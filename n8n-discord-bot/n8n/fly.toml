# Fly.io configuration for n8n
# Deploy with: flyctl deploy --config fly.toml
# Set secrets with: flyctl secrets set N8N_ENCRYPTION_KEY=...

app = "alitravians-n8n"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  N8N_PORT = "5678"
  N8N_PROTOCOL = "https"
  N8N_HOST = "alitravians-n8n.fly.dev"
  WEBHOOK_URL = "https://alitravians-n8n.fly.dev"
  GENERIC_TIMEZONE = "Asia/Riyadh"
  TZ = "Asia/Riyadh"
  DB_TYPE = "sqlite"
  DB_SQLITE_DATABASE = "/data/database.sqlite"
  N8N_USER_FOLDER = "/home/node/.n8n"
  EXECUTIONS_MODE = "regular"
  EXECUTIONS_DATA_PRUNE = "true"
  EXECUTIONS_DATA_MAX_AGE = "168"
  N8N_METRICS = "true"
  N8N_LOG_LEVEL = "info"
  N8N_PERSONALIZATION_ENABLED = "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED = "false"
  N8N_DIAGNOSTICS_ENABLED = "false"

[mounts]
  source = "n8n_data"
  destination = "/data"

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
