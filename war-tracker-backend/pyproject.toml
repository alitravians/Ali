[project]
name = "war-tracker-backend"
version = "0.1.0"
description = "WarScope - Real-time war tracking backend with GDELT, NewsAPI, OpenSky, and Gemini AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "fastapi-cli>=0.0.5",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.1",
    "google-generativeai>=0.8.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
