# fly.toml app configuration file generated for war-tracker-backend-v2 on 2026-04-22T09:54:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'war-tracker-backend-v2'
primary_region = 'iad'

[env]
  PORT = '8080'

[[mounts]]
  source = 'warscope_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '20s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/api/health'
