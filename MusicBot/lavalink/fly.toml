app = "music-lavalink-am"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  # JVM heap. Lavalink benefits from a fixed heap (avoids GC stalls).
  _JAVA_OPTIONS = "-Xmx384M -Xms256M"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[services]]
  protocol = "tcp"
  internal_port = 2333
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    # Expose 2333 only on the private 6PN network (.flycast / .internal).
    # No public ports — the bot is the only client and reaches it over flycast.
    port = 2333

  [services.tcp_checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[deploy]
  strategy = "immediate"
