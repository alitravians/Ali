# Fly.io config for the BOON Community Discord bot.
# Deploy with: flyctl deploy --config fly.toml
app = "boon-community-bot"
primary_region = "ams"          # change to closest region
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  GITHUB_REPO = "alitravians/Ali"
  LOG_LEVEL = "INFO"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false    # bot must stay online for Discord gateway
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
