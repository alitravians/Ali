[project]
name = "boon-community-bot"
version = "0.1.0"
description = "BOON Community Discord bot — welcome flow, info commands, GitHub release relay."
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.4.0",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # let formatter handle line length

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
