app = "competitions-bot-am"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/competitions.db"

[[mounts]]
  source = "competitions_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "immediate"

[processes]
  app = "python -m bot.main"
