<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رحلة الفضاء - محطة الفضاء الدولية</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@400;500;700;900&family=Tajawal:wght@300;400;500;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #030810; font-family: 'Tajawal', 'Cairo', sans-serif; }
    #game-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    #ui-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #ui-overlay > * { pointer-events: auto; }
    .hidden { display: none !important; }

    /* ===== CINEMATIC LOADING SCREEN ===== */
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #030810;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; transition: opacity 1.5s ease-out;
      overflow: hidden;
    }

    /* Animated star field background */
    #loading-screen::before {
      content: '';
      position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: 
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 15% 75%, rgba(100,180,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 25%, rgba(255,200,100,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 35%, rgba(200,220,255,0.5) 0%, transparent 100%);
      animation: starDrift 60s linear infinite;
      pointer-events: none; z-index: 0;
    }

    /* Atmospheric glow */
    #loading-screen::after {
      content: '';
      position: absolute; bottom: -20%; left: 50%; transform: translateX(-50%);
      width: 140%; height: 50%;
      background: radial-gradient(ellipse at 50% 100%, rgba(30,80,170,0.15) 0%, transparent 60%);
      pointer-events: none; z-index: 1;
    }

    @keyframes starDrift {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-10%) rotate(0.5deg); }
    }

    .loading-content {
      position: relative; z-index: 5;
      display: flex; flex-direction: column; align-items: center;
    }

    /* Mission Patch / Emblem */
    .mission-emblem {
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(100,160,255,0.3);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      margin-bottom: 30px;
      animation: emblemPulse 3s ease-in-out infinite;
    }

    .mission-emblem::before {
      content: '';
      position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(100,200,255,0.6);
      border-right-color: rgba(100,200,255,0.3);
      animation: emblemSpin 4s linear infinite;
    }

    .mission-emblem::after {
      content: '';
      position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-bottom-color: rgba(150,100,255,0.4);
      border-left-color: rgba(150,100,255,0.2);
      animation: emblemSpin 6s linear infinite reverse;
    }

    .mission-emblem .emblem-inner {
      font-size: 3.5rem;
      filter: drop-shadow(0 0 20px rgba(100,180,255,0.4));
    }

    @keyframes emblemSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes emblemPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(100,160,255,0.1), inset 0 0 30px rgba(100,160,255,0.05); }
      50% { box-shadow: 0 0 50px rgba(100,160,255,0.2), inset 0 0 50px rgba(100,160,255,0.1); }
    }

    .loading-title {
      font-family: 'Exo 2', 'Orbitron', sans-serif;
      font-size: 2.8rem; font-weight: 800;
      background: linear-gradient(135deg, #e0e8ff 0%, #8ab4f8 50%, #c0d0ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 6px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .loading-subtitle {
      font-family: 'Tajawal', sans-serif;
      font-size: 1.15rem; color: rgba(160,180,220,0.6);
      font-weight: 300; letter-spacing: 2px;
      margin-bottom: 35px;
    }

    /* Progress ring */
    .loading-progress {
      position: relative;
      width: 280px; height: 4px;
      background: rgba(100,160,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .loading-progress-fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #4a8af4, #8ab4f8, #4a8af4);
      background-size: 200% 100%;
      border-radius: 2px;
      transition: width 0.5s ease;
      animation: progressShimmer 2s linear infinite;
      box-shadow: 0 0 12px rgba(74,138,244,0.4);
    }

    @keyframes progressShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .loading-status {
      color: rgba(140,170,220,0.5);
      font-size: 0.72rem;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loading-footer {
      position: absolute; bottom: 20px; left: 0; right: 0;
      text-align: center; z-index: 5;
    }

    .loading-footer span {
      color: rgba(100,140,200,0.2);
      font-size: 0.6rem;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay"></div>
  <div id="loading-screen">
    <div class="loading-content">
      <div class="mission-emblem">
        <div class="emblem-inner">🛸</div>
      </div>
      <div class="loading-title">ISS Mission</div>
      <div class="loading-subtitle">رحلة إلى محطة الفضاء الدولية</div>
      <div class="loading-progress">
        <div class="loading-progress-fill" id="loading-bar"></div>
      </div>
      <div class="loading-status" id="loading-text">تحميل أنظمة المحاكاة</div>
    </div>
    <div class="loading-footer">
      <span>EXPEDITION 72 — SIMULATION</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
