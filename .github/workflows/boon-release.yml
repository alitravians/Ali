# Builds alitravians runtime + cross-platform GUI installer binaries and
# uploads them as GitHub Release assets. Triggered when a tag matching
# `boon-v*` is pushed.
#
# Tag scheme is intentionally kept as `boon-v*` (the internal repo / project
# code-name) so that older patcher.js builds that resolve the latest release
# by tag prefix continue to work end-to-end. Display names everywhere else
# (installer GUI, README, release title) use the new `alitravians` brand.
#
# Outputs (attached to the release):
#   - patcher.js                                (Electron main-process patcher)
#   - renderer.js                               (renderer payload)
#   - boon.user.js                              (Userscript build)
#   - alitravians-installer-windows-amd64.exe   (GUI installer, Windows 64-bit)
#   - alitravians-installer-macos-amd64         (GUI installer, macOS Intel)
#   - alitravians-installer-macos-arm64         (GUI installer, macOS Apple Silicon)
#   - alitravians-installer-linux-amd64         (GUI installer, Linux 64-bit)
#
# The installer binary now embeds patcher.js + renderer.js directly, so it
# does NOT need network access at install time (previous versions hit the
# GitHub Releases API and could be rate-limited to HTTP 403).
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: boon-release

on:
  push:
    tags:
      - "boon-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release as (e.g. boon-v0.1.2). Required for manual runs."
        required: true

permissions:
  contents: write

jobs:
  build-runtime:
    name: Build alitravians runtime (patcher.js + renderer.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: boon
        run: |
          npm ci
          npm run typecheck
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: boon-runtime
          path: |
            boon/dist/desktop/patcher.js
            boon/dist/desktop/renderer.js
            boon/dist/boon.user.js

  build-installer-linux:
    name: Build installer (linux amd64)
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/download-artifact@v4
        with:
          name: boon-runtime
          path: runtime-dl
      - name: Stage runtime files
        run: |
          mkdir -p boon-installer/runtime
          find runtime-dl -name patcher.js  -exec cp {} boon-installer/runtime/ \;
          find runtime-dl -name renderer.js -exec cp {} boon-installer/runtime/ \;
          ls -la boon-installer/runtime/
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxi-dev libxxf86vm-dev pkg-config
      - name: Build
        working-directory: boon-installer
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#boon-v}"
          go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o alitravians-installer-linux-amd64 .
          ls -la alitravians-installer-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: alitravians-installer-linux-amd64
          path: boon-installer/alitravians-installer-linux-amd64

  build-installer-windows:
    name: Build installer (windows amd64, mingw cross)
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/download-artifact@v4
        with:
          name: boon-runtime
          path: runtime-dl
      - name: Stage runtime files
        run: |
          mkdir -p boon-installer/runtime
          find runtime-dl -name patcher.js  -exec cp {} boon-installer/runtime/ \;
          find runtime-dl -name renderer.js -exec cp {} boon-installer/runtime/ \;
          ls -la boon-installer/runtime/
      - name: Install mingw cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Generate Windows resource (icon + version info)
        working-directory: boon-installer
        run: |
          # rsrc emits a `*_windows_amd64.syso` file. The Go linker
          # automatically picks it up for the matching GOOS/GOARCH so the
          # produced .exe carries the alitravians icon in File Explorer, the
          # taskbar and the Alt-Tab switcher.
          go install github.com/akavel/rsrc@latest
          $(go env GOPATH)/bin/rsrc -ico assets/logo.ico -arch amd64 -o resource_windows_amd64.syso
          ls -la resource_windows_amd64.syso
      - name: Build (Windows GUI subsystem)
        working-directory: boon-installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#boon-v}"
          # -H windowsgui suppresses the console window so users get a clean
          # GUI experience instead of a black terminal flashing on launch.
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.Version=${VERSION}" \
            -o alitravians-installer-windows-amd64.exe .
          ls -la alitravians-installer-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: alitravians-installer-windows-amd64
          path: boon-installer/alitravians-installer-windows-amd64.exe

  build-installer-macos:
    name: Build installer (macos ${{ matrix.arch }})
    runs-on: macos-latest
    needs: build-runtime
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/download-artifact@v4
        with:
          name: boon-runtime
          path: runtime-dl
      - name: Stage runtime files
        run: |
          mkdir -p boon-installer/runtime
          find runtime-dl -name patcher.js  -exec cp {} boon-installer/runtime/ \;
          find runtime-dl -name renderer.js -exec cp {} boon-installer/runtime/ \;
          ls -la boon-installer/runtime/
      - name: Build
        working-directory: boon-installer
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#boon-v}"
          go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o alitravians-installer-macos-${{ matrix.arch }} .
          ls -la alitravians-installer-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: alitravians-installer-macos-${{ matrix.arch }}
          path: boon-installer/alitravians-installer-macos-${{ matrix.arch }}

  release:
    name: Publish GitHub Release
    needs:
      - build-runtime
      - build-installer-linux
      - build-installer-windows
      - build-installer-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact tree
        run: |
          mkdir -p out
          find artifacts -type f -exec cp -v {} out/ \;
          ls -la out
      - name: Compute tag name
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "alitravians ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            out/patcher.js
            out/renderer.js
            out/boon.user.js
            out/alitravians-installer-*
